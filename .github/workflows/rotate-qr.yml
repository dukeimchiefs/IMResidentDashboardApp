name: Rotate weekly QR codes

on:
  schedule:
    # Saturday ~4-5am America/New_York (UTC-5/UTC-4). Lectures run Mon-Fri, so
    # rotating on Saturday leaves a full lecture-free day of slack: GitHub's
    # scheduled runs are best-effort and have been starting 3-8 hours late,
    # which under the old daily cron left a stale QR on screen well into noon
    # conference. Tokens are anchored to the week (see week_anchor in
    # scripts/generate_qr.py), so even a run that slips past Saturday still
    # emits this week's correct token.
    - cron: '0 9 * * 6'
  workflow_dispatch:
    inputs:
      event_types:
        description: >-
          Space-separated event types to (re)generate, e.g. "welcome". Defaults
          to the weekly lecture set. Useful for one-off regeneration of a static
          event (like welcome) with the correct QR_SECRET, since that secret
          can't be read back out to regenerate it locally by hand.
        required: false
        default: 'noon learning grandrounds'

permissions:
  contents: write

jobs:
  rotate-qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install qrcode[pil]
      # EVENT_TYPES goes through env, not a direct ${{ }} splice into the run
      # script — GitHub substitutes ${{ }} into the script text before the
      # shell parses it, so an input containing shell metacharacters would
      # execute as code. An env var is safely word-split by the shell but
      # never re-parsed for metacharacters.
      - run: python scripts/generate_qr.py $EVENT_TYPES
        env:
          QR_SECRET: ${{ secrets.QR_SECRET }}
          EVENT_TYPES: ${{ github.event.inputs.event_types || 'noon learning grandrounds' }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rotate weekly QR codes'
          file_pattern: 'frontend/assets/qr/qr_*.png'
