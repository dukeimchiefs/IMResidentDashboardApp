<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resident Learning Check-In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- There is nothing to do here. Check-in happens entirely on /checkin, which
       the QR code opens directly, so this page exists only for the resident who
       types the bare domain in and wonders where the app went. -->
  <div class="card">
    <h1>Resident Learning Check-In</h1>
    <p class="lede">Point your phone's camera at the QR code on the screen, then tap the link that appears.</p>
    <p class="lede">Type your name on the page that opens. That's the whole thing — there is no password and nothing to install.</p>
    <p class="hint">Code won't scan, or your name isn't recognised? See a chief resident.</p>
  </div>
</body>
</html>
