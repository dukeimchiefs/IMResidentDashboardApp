<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noon Conference Check-In</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    figure {
      margin: 0;
      text-align: center;
    }
    img {
      width: 60vmin;
      height: 60vmin;
      image-rendering: pixelated;
    }
    figcaption {
      margin-top: 1.5rem;
      font-size: 3rem;
      font-weight: 600;
      color: #012169;
    }
    /* Residents no longer open an app to scan -- the code is a plain link that
       the phone's built-in camera opens on its own. Saying so on the projected
       slide is the cheapest place to teach the new flow. */
    .how {
      margin-top: 0.75rem;
      font-size: 1.5rem;
      color: #57606a;
    }
  </style>
</head>
<body>
  <figure>
    <img src="assets/qr/qr_noon.png" alt="Noon Conference QR code" />
    <figcaption>Noon Conference</figcaption>
    <p class="how">Point your camera at the code, then type your name.</p>
  </figure>
</body>
</html>
