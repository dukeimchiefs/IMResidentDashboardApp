name = "imresidentdashboardapp-retry"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Cloudflare Pages Functions cannot run Cron Triggers — scheduled execution
# requires a standalone Worker, hence this separate deployable. It shares the
# same D1 database as the main Pages project.
# Every 3 minutes, not 15: this is the worst-case wait for a resident whose
# first send hit the daily cap or errored, and 15 minutes of standing at a
# lecture-room door was too long. COUPLED TO MAX_ATTEMPTS in src/index.js —
# attempts x cadence is the total window before a queued email is given up on
# and deleted, so changing this cadence without changing MAX_ATTEMPTS silently
# shrinks that window.
[triggers]
crons = ["*/3 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "attendance-db"
database_id = "b989ffda-3604-4f37-a13d-e1c685848f9c"

[vars]
RESEND_FROM = "noreply@nicholasbrazeau.com"
# Must mirror the main wrangler.toml — both deployables send through the same
# sendMagicLinkEmail(), so a reply address set in only one place means retried
# sign-in emails silently lose it.
RESEND_REPLY_TO = "residency@nicholasbrazeau.com"
# Base URL used to build /verify links since a scheduled handler has no
# incoming request to derive it from. Update if a custom domain is added.
APP_URL = "https://imresidentdashboardapp.pages.dev"
